version: '3.8'

services:
  besu-node1:
    image: hyperledger/besu:24.1.0
    container_name: vigilant-besu-node1
    environment:
      - BESU_LOGGING=INFO
    volumes:
      - ./genesis.json:/opt/besu/genesis.json:ro
      - besu_data_node1:/opt/besu/data
    command:
      - --data-path=/opt/besu/data
      - --genesis-file=/opt/besu/genesis.json
      - --rpc-http-enabled=true
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,QBFT,WEB3
      - --rpc-http-cors-origins=*
      - --rpc-ws-enabled=true
      - --rpc-ws-host=0.0.0.0
      - --rpc-ws-port=8546
      - --rpc-ws-api=ETH,NET,QBFT,WEB3
      - --host-allowlist=*
      - --min-gas-price=0
    ports:
      - "8545:8545"
      - "8546:8546"
    networks:
      - vigilant-besu-net

  besu-node2:
    image: hyperledger/besu:24.1.0
    container_name: vigilant-besu-node2
    environment:
      - BESU_LOGGING=INFO
    volumes:
      - ./genesis.json:/opt/besu/genesis.json:ro
      - besu_data_node2:/opt/besu/data
    command:
      - --data-path=/opt/besu/data
      - --genesis-file=/opt/besu/genesis.json
      - --min-gas-price=0
    depends_on:
      - besu-node1
    networks:
      - vigilant-besu-net

volumes:
  besu_data_node1:
  besu_data_node2:

networks:
  vigilant-besu-net:
    driver: bridge
